  --line:rgba(245,230,238,0.14);
  --shadow:0 10px 26px rgba(0,0,0,0.4);
}
html.dark-mode body{
  background:
    radial-gradient(1100px 700px at 15% -10%, var(--bg-2) 0%, transparent 60%),
    radial-gradient(900px 650px at 100% 0%, #322030 0%, transparent 55%),
    var(--bg);
}
/* Các khối "frosted white glass" (chip, thẻ chế độ, nút, ô nhập...) được tính riêng
   cho nền sáng — độ mờ đó khi để trên nền tối lại làm khung sáng gần bằng màu
   chữ, mất tương phản. Hạ hẳn độ mờ xuống để khung chỉ sáng hơn nền 1 chút. */
html.dark-mode .icon-btn{ background:rgba(255,255,255,0.08); }
html.dark-mode .icon-btn:active{ background:rgba(255,255,255,0.16); }
html.dark-mode .chip{ background:rgba(255,255,255,0.07); color:var(--text); }
html.dark-mode .chip.done{ background:var(--jade-soft); color:var(--jade); }
html.dark-mode .chip.active{ background:var(--accent-dark); border-color:var(--accent-dark); color:#fff; }
html.dark-mode .chip.done.active{ background:var(--jade-dark); border-color:var(--jade-dark); color:#fff; }
html.dark-mode .mode-card{ background:rgba(255,255,255,0.055); }
html.dark-mode .mode-card:active{ background:rgba(255,255,255,0.11); }
html.dark-mode .nav-btn{ background:rgba(255,255,255,0.07); }
html.dark-mode .nav-btn:active{ background:rgba(255,255,255,0.14); }
html.dark-mode .mcq-opt{ background:rgba(255,255,255,0.07); }
html.dark-mode .mcq-opt:active{ background:rgba(255,255,255,0.14); }
html.dark-mode .type-input{ background:rgba(255,255,255,0.08); }
html.dark-mode .wrong-item{ background:rgba(255,255,255,0.05); }
html.dark-mode .speed-card{ background:rgba(255,255,255,0.055); }
html.dark-mode .history-item{ background:rgba(255,255,255,0.055); }
html.dark-mode .history-item:active{ background:rgba(255,255,255,0.11); }
html.dark-mode .contact-link{ background:rgba(255,255,255,0.06); color:var(--accent); }
html.dark-mode .contact-link:active{ background:rgba(255,255,255,0.12); }
html.dark-mode .jump-row:active{ background:rgba(255,255,255,0.07); }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(1100px 700px at 15% -10%, var(--bg-2) 0%, transparent 60%),
    radial-gradient(900px 650px at 100% 0%, #F0D9E1 0%, transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:'Be Vietnam Pro', -apple-system, system-ui, sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

.hanzi, .font-hanzi{ font-family:'Noto Serif SC', 'Noto Serif', serif; }
.serif{ font-family:'Noto Serif', serif; }

#app{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  padding-bottom:calc(18px + var(--safe-b));
}

/* ---------- header ---------- */
.topbar{
  display:flex;
  align-items:center;
  gap:12px;
  padding:calc(16px + var(--safe-t)) 18px 14px;
  position:sticky;
  top:0;
  z-index:20;
  background:linear-gradient(180deg, var(--bg) 65%, transparent);
  backdrop-filter:blur(6px);
}
.seal-mark{
  width:38px; height:38px; min-width:38px;
  border-radius:8px;
  background:var(--accent-dark);
  color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-family:'Noto Serif SC', serif;
  font-size:19px;
  box-shadow:0 3px 10px rgba(201,127,138,0.4), inset 0 0 0 1px rgba(255,255,255,0.18);
  transform:rotate(-3deg);
  flex-shrink:0;
  cursor:pointer;
  border:none;
}
.brand{
  display:flex; flex-direction:column; line-height:1.15;
}
.brand b{ font-family:'Noto Serif', serif; font-size:17px; letter-spacing:.2px; color:var(--text);}
.brand span{ font-size:11px; color:var(--text-muted); letter-spacing:.5px; text-transform:uppercase;}

.back-btn{
  background:none; border:none; color:var(--text);
  font-size:22px; padding:4px 8px; margin-left:-8px; cursor:pointer;
  border-radius:8px;
}
.back-btn:active{ background:rgba(74,53,72,0.08); }

.spacer{flex:1;}
.icon-btn{
  background:rgba(255,255,255,0.6);
  border:1px solid var(--line);
  color:var(--text);
  width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:17px; cursor:pointer;
  text-decoration:none;
}
.icon-btn:active{ background:rgba(255,255,255,0.9); }

.icon-btn-accent{
  background:var(--accent-dark);
  border:1px solid var(--accent-dark);
  color:#fff;
  box-shadow:0 3px 10px rgba(201,127,138,0.4);
}
.icon-btn-accent:active{ background:var(--accent-dark); opacity:0.85; }

main{ flex:1; padding:2px 18px 12px; }

/* ---------- home: level grid ---------- */
.section-label{
  font-size:12px; text-transform:uppercase; letter-spacing:1.2px;
  color:var(--gold); margin:14px 2px 8px; font-weight:600;
}
.level-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:7px;
}
.level-card{
  background:linear-gradient(160deg, var(--surface), var(--surface-2));
  border-radius:var(--radius);
  padding:10px 12px 9px;
  color:var(--text);
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow);
  cursor:pointer;
  border:1px solid rgba(255,255,255,0.6);
  transition:transform .15s ease;
}
.level-card:active{ transform:scale(.97); }
.level-card .lv{
  font-family:'Noto Serif SC', serif;
  font-size:25px; font-weight:700; line-height:1;
}
.level-card .lv-name{ font-size:11.5px; color:var(--text-muted); margin-top:3px; }
.level-card .lv-count{ font-size:10.5px; color:var(--accent-dark); margin-top:6px; font-weight:600;}
.level-card .lv-progress{
  margin-top:6px; height:4px; border-radius:3px; background:rgba(74,53,72,0.08); overflow:hidden;
}
.level-card .lv-progress i{
  display:block; height:100%; background:var(--jade); border-radius:3px;
}
.level-card .stamp{
  position:absolute; right:-6px; top:-6px;
  width:46px; height:46px; border-radius:50%;
  border:2px solid var(--accent);
  opacity:0.25;
  display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif SC',serif; color:var(--accent-dark); font-size:20px;
  transform:rotate(12deg);
}

.hero{
  margin-top:4px;
  padding:14px 16px;
  border-radius:18px;
  background:
    url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27520%27%20height%3D%27110%27%20viewBox%3D%270%200%20520%20110%27%3E%20%20%20%20%20%20%20%3Cpath%20d%3D%27M0%2C100%20C90%2C65%20130%2C45%20200%2C60%20C260%2C72%20300%2C50%20360%2C58%20C420%2C70%20470%2C55%20520%2C80%20L520%2C110%20L0%2C110%20Z%27%20fill%3D%27rgba%2874%2C53%2C72%2C0.06%29%27/%3E%20%20%20%20%20%20%20%3Cpath%20d%3D%27M0%2C100%20C90%2C65%20130%2C45%20200%2C60%20C260%2C72%20300%2C50%20360%2C58%20C420%2C70%20470%2C55%20520%2C80%27%20stroke%3D%27rgba%2874%2C53%2C72%2C0.13%29%27%20stroke-width%3D%273%27%20fill%3D%27none%27/%3E%20%20%20%20%20%20%20%3Crect%20x%3D%27-5%27%20y%3D%2788%27%20width%3D%2710%27%20height%3D%279%27%20fill%3D%27rgba%2874%2C53%2C72%2C0.12%29%27/%3E%3Crect%20x%3D%2754%27%20y%3D%2765%27%20width%3D%2710%27%20height%3D%279%27%20fill%3D%27rgba%2874%2C53%2C72%2C0.12%29%27/%3E%3Crect%20x%3D%27102%27%20y%3D%2749%27%20width%3D%2710%27%20height%3D%279%27%20fill%3D%27rgba%2874%2C53%2C72%2C0.12%29%27/%3E%3Crect%20x%3D%27147%27%20y%3D%2743%27%20width%3D%2710%27%20height%3D%279%27%20fill%3D%27rgba%2874%2C53%2C72%2C0.12%29%27/%3E%3Crect%20x%3D%27195%27%20y%3D%2748%27%20width%3D%2710%27%20height%3D%279%27%20fill%3D%27rgba%2874%2C53%2C72%2C0.12%29%27/%3E%3Crect%20x%3D%27217%27%20y%3D%2751%27%20width%3D%2710%27%20height%3D%279%27%20fill%3D%27rgba%2874%2C53%2C72%2C0.12%29%27/%3E%3Crect%20x%3D%27256%27%20y%3D%2751%27%20width%3D%2710%27%20height%3D%279%27%20fill%3D%27rgba%2874%2C53%2C72%2C0.12%29%27/%3E%3Crect%20x%3D%27294%27%20y%3D%2746%27%20width%3D%2710%27%20height%3D%279%27%20fill%3D%27rgba%2874%2C53%2C72%2C0.12%29%27/%3E%3Crect%20x%3D%27333%27%20y%3D%2744%27%20width%3D%2710%27%20height%3D%279%27%20fill%3D%27rgba%2874%2C53%2C72%2C0.12%29%27/%3E%3Crect%20x%3D%27355%27%20y%3D%2746%27%20width%3D%2710%27%20height%3D%279%27%20fill%3D%27rgba%2874%2C53%2C72%2C0.12%29%27/%3E%3Crect%20x%3D%27398%27%20y%3D%2751%27%20width%3D%2710%27%20height%3D%279%27%20fill%3D%27rgba%2874%2C53%2C72%2C0.12%29%27/%3E%3Crect%20x%3D%27439%27%20y%3D%2752%27%20width%3D%2710%27%20height%3D%279%27%20fill%3D%27rgba%2874%2C53%2C72%2C0.12%29%27/%3E%3Crect%20x%3D%27477%27%20y%3D%2756%27%20width%3D%2710%27%20height%3D%279%27%20fill%3D%27rgba%2874%2C53%2C72%2C0.12%29%27/%3E%3Crect%20x%3D%27515%27%20y%3D%2768%27%20width%3D%2710%27%20height%3D%279%27%20fill%3D%27rgba%2874%2C53%2C72%2C0.12%29%27/%3E%20%20%20%20%20%20%20%20%20%20%20%20%20%20%3Crect%20x%3D%27119%27%20y%3D%2725%27%20width%3D%2718%27%20height%3D%2716%27%20fill%3D%27rgba%2874%2C53%2C72%2C0.15%29%27/%3E%20%20%20%20%20%20%20%3Cpolygon%20points%3D%27116%2C25%20128%2C13%20140%2C25%27%20fill%3D%27rgba%2874%2C53%2C72%2C0.15%29%27/%3E%20%20%20%20%20%20%20%20%20%20%3C/svg%3E") no-repeat 76% 100%/125px auto,
    url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27600%27%20height%3D%27140%27%20viewBox%3D%270%200%20600%20140%27%3E%3Cpath%20d%3D%27M0%2C140%20Q39%2C60%2086%2C125%20Q126%2C35%20171%2C132%20Q216%2C76%20257%2C128%20Q304%2C61%20343%2C123%20Q381%2C18%20429%2C120%20Q469%2C66%20514%2C115%20Q557%2C40%20600%2C119%20L600%2C140%20L0%2C140%20Z%27%20fill%3D%27rgba%28203%2C141%2C168%2C0.16%29%27/%3E%3C/svg%3E") no-repeat -6% 100%/250px auto,
    radial-gradient(120% 160% at 0% 0%, var(--surface-2) 0%, var(--bg-2) 65%);
  border:1px solid rgba(255,255,255,0.5);
  position:relative;
  overflow:hidden;
}
.hero .hz-big{
  font-family:'Noto Serif SC', serif;
  font-size:64px; line-height:1; color:rgba(201,127,138,0.15);
  position:absolute; right:6px; top:6px; user-select:none;
}
.hero h1{
  font-family:'Noto Serif', serif; font-weight:600;
  font-size:20px; margin:0 0 5px; letter-spacing:.2px; color:var(--text);
}
.hero p{ margin:0; color:var(--text-muted); font-size:13px; line-height:1.4; max-width:88%;}

/* ---------- level detail ---------- */
.level-title{
  display:flex; align-items:baseline; gap:10px; margin:10px 2px 2px;
}
.level-title .num{ font-family:'Noto Serif SC',serif; font-size:34px; color:var(--text);}
.level-title .meta{ color:var(--text-muted); font-size:13px; }

.chip-row{
  display:flex; gap:8px; overflow-x:auto; padding:14px 2px 4px; scrollbar-width:none;
}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto; padding:8px 14px; border-radius:999px;
  background:rgba(255,255,255,0.65); border:1px solid var(--line);
  font-size:13px; color:var(--text); cursor:pointer; white-space:nowrap;
}
.chip.active{ background:var(--accent-dark); border-color:var(--accent-dark); color:#fff; font-weight:600;}
.chip.done{ background:var(--jade-soft); border-color:var(--jade); color:var(--jade-dark); font-weight:600; }
.chip.done.active{ background:var(--jade-dark); border-color:var(--jade-dark); color:#fff; }
.chip-check{ font-weight:700; }

.mode-list{ display:flex; flex-direction:column; gap:10px; margin-top:16px;}
.mode-card{
  display:flex; align-items:center; gap:14px;
  background:rgba(255,255,255,0.55);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  cursor:pointer;
}
.mode-card:active{ background:rgba(255,255,255,0.85); }
.mode-card .m-icon{
  width:44px; height:44px; border-radius:10px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:20px;
  background:var(--accent-soft); color:var(--accent-dark);
}
.mode-card .m-txt b{ display:block; font-size:15px; margin-bottom:2px; font-family:'Noto Serif',serif; font-weight:600; color:var(--text);}
.mode-card .m-txt span{ font-size:12.5px; color:var(--text-muted); }
.mode-card .m-arrow{ margin-left:auto; color:var(--text-muted); font-size:18px;}

/* ---------- flashcard ---------- */
.progress-track{
  height:4px; background:rgba(74,53,72,0.08); border-radius:2px; overflow:hidden; margin:6px 0 18px;
}
.progress-track i{ display:block; height:100%; background:var(--accent-dark); }

.flip-wrap{ perspective:1400px; margin-top:6px; }
.card{
  min-height:340px;
  border-radius:20px;
  background:linear-gradient(165deg, var(--surface), var(--surface-2));
  color:var(--text);
  box-shadow:var(--shadow);
  position:relative;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:28px 22px;
  cursor:pointer;
  text-align:center;
  border:1px solid rgba(255,255,255,0.6);
}
.card .bai-tag{
  position:absolute; top:14px; left:16px; font-size:11px; color:var(--gold);
  text-transform:uppercase; letter-spacing:.6px; font-weight:700;
}
.card .star-btn{
  position:absolute; top:10px; right:10px; background:none;border:none; font-size:22px; cursor:pointer;
  color:#EBC9D8;
}
.card .star-btn.active{ color:var(--accent-dark); }
.card .word{
  font-family:'Noto Serif SC', serif;
  font-size:58px; font-weight:700; line-height:1.1; margin-bottom:6px;
  word-break:break-word; color:var(--text);
}
.card .pos-tag{
  font-size:12px; color:var(--text-muted); background:rgba(74,53,72,0.06);
  padding:3px 10px; border-radius:999px; margin-top:6px;
}
.card .hint{
  position:absolute; bottom:14px; font-size:11px; color:var(--text-muted); letter-spacing:.3px;
}
.card .back-content{
  display:flex; flex-direction:column; gap:10px; width:100%;
}
.card .meaning{ font-size:17px; font-weight:600; color:var(--text);}
.card .amhv{ font-size:13px; color:var(--gold); }
.card .example-block{
  margin-top:6px; padding-top:12px; border-top:1px dashed rgba(74,53,72,0.16);
  text-align:left;
}
.card .example-hz{ font-family:'Noto Serif SC',serif; font-size:19px; margin-bottom:4px; color:var(--text);}
.card .example-py{ font-size:13px; font-style:italic; color:var(--text); margin-bottom:4px;}
.card .example-hz .hl-word{ color:var(--accent-dark); font-weight:700; }
.card .example-py .hl-word{ color:var(--accent-dark); font-weight:700; font-style:normal; }
.card .example-vi{ font-size:13.5px; color:#6E5568;}

.tts-btn{
  margin-top:16px;
  display:inline-flex; align-items:center; gap:8px;
  background:var(--accent-dark); color:#fff;
  border:none; padding:10px 18px; border-radius:999px;
  font-size:13.5px; cursor:pointer;
}
.tts-btn:active{ transform:scale(.96); }

.nav-row{
  display:flex; align-items:center; gap:10px; margin-top:18px;
}
.nav-btn{
  flex:1; padding:14px; border-radius:12px; border:1px solid var(--line);
  background:rgba(255,255,255,0.55); color:var(--text); font-size:14px; cursor:pointer; font-weight:600;
}
.nav-btn:active{ background:rgba(255,255,255,0.9); }
.nav-btn.primary{ background:var(--accent-dark); border-color:var(--accent-dark); color:#fff; }
.nav-btn:disabled{ opacity:.4; }

.memory-row{
  display:flex; align-items:center; gap:10px; margin-top:14px;
}
.mem-btn{
  flex:1; padding:13px; border-radius:12px; border:1px solid transparent;
  font-size:14px; cursor:pointer; font-weight:700;
}
.mem-btn:active{ transform:scale(.97); }
.mem-btn.unknown{ background:var(--accent-soft); border-color:var(--accent-dark); color:var(--accent-dark); }
.mem-btn.known{ background:var(--jade-soft); border-color:var(--jade-dark); color:var(--jade-dark); }

/* ---------- quiz ---------- */
.quiz-top{ display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--text-muted); margin-bottom:10px;}
.score-pill{ background:var(--jade-soft); color:var(--jade-dark); padding:4px 10px; border-radius:999px; font-weight:600; }

.q-card{
  background:linear-gradient(165deg, var(--surface), var(--surface-2));
  border-radius:20px; padding:26px 22px; color:var(--text);
  box-shadow:var(--shadow); text-align:center; position:relative; min-height:150px;
  border:1px solid rgba(255,255,255,0.6);
}
.q-card .q-meaning{ font-size:20px; font-weight:700; font-family:'Noto Serif',serif; color:var(--text);}
.q-card .q-pos{ font-size:12px; color:var(--text-muted); margin-top:6px;}
.q-card .q-hint{ font-size:13px; color:var(--gold); margin-top:10px; font-style:italic;}
.q-feedback{
  font-size:14px; font-weight:700; min-height:0; margin-top:0;
  max-height:0; opacity:0; overflow:hidden;
  transition:max-height .25s ease, opacity .2s ease, margin-top .25s ease;
}
.q-feedback.show{ max-height:40px; opacity:1; margin-top:12px; }
.q-feedback.ok{ color:var(--jade-dark); }
.q-feedback.bad{ color:var(--accent-dark); }

.stamp-overlay{
  position:absolute; top:10px; right:10px; width:auto; height:auto;
  pointer-events:none; opacity:0; transform:scale(1.4) rotate(-14deg);
}
.stamp-overlay.show{
  animation:stampIn .45s cubic-bezier(.2,1.4,.4,1) forwards;
}
@keyframes stampIn{
  0%{opacity:0; transform:scale(1.8) rotate(-14deg);}
  60%{opacity:1; transform:scale(0.92) rotate(-14deg);}
  100%{opacity:1; transform:scale(1) rotate(-14deg);}
}
.stamp-overlay .stamp-ring{
  width:52px; height:52px; border-radius:50%;
  border:3px solid var(--jade-dark); color:var(--jade-dark);
  background:var(--surface);
  display:flex; align-items:center; justify-content:center;
  font-family:'Noto Serif SC',serif; font-size:20px; font-weight:700;
  box-shadow:var(--shadow);
}
.stamp-overlay.wrong .stamp-ring{ border-color:var(--accent-dark); color:var(--accent-dark); }

.mcq-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px;
}
.mcq-opt{
  font-family:'Noto Serif SC',serif; font-size:24px;
  background:rgba(255,255,255,0.55); border:1px solid var(--line); color:var(--text);
  padding:20px 8px; border-radius:14px; cursor:pointer;
}
.mcq-opt:active{ background:rgba(255,255,255,0.9); }
.mcq-opt.correct{ background:var(--jade-soft); border-color:var(--jade-dark); }
.mcq-opt.incorrect{ background:var(--accent-soft); border-color:var(--accent-dark); }
.mcq-opt:disabled{ opacity:.85; }
.mcq-opt-py{
  font-family:'Noto Serif', serif; font-style:italic; font-size:12px;
  color:var(--text-muted); margin-top:3px;
}
.mcq-opt-meaning{
  font-family:'Noto Serif', serif; font-size:11px;
  color:var(--text-muted); margin-top:2px; line-height:1.3;
}

.type-wrap{ margin-top:18px; display:flex; flex-direction:column; gap:12px;}
.type-input{
  font-family:'Noto Serif SC',serif; font-size:26px; text-align:center;
  padding:16px; border-radius:12px; border:1px solid var(--line);
  background:rgba(255,255,255,0.6); color:var(--text);
  outline:none;
}
.type-input:focus{ border-color:var(--accent-dark); }
.type-actions{ display:flex; gap:10px; }
.type-feedback{ text-align:center; font-size:14px; min-height:20px; }
.type-feedback.ok{ color:var(--jade-dark); }
.type-feedback.bad{ color:var(--accent-dark); }

.result-card{
  background:linear-gradient(165deg, var(--surface), var(--surface-2)); border-radius:20px;
  padding:30px 22px; text-align:center; color:var(--text); box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,0.6);
}
.result-card .big-num{ font-family:'Noto Serif SC',serif; font-size:52px; font-weight:700; color:var(--accent-dark);}
.result-card p{ color:var(--text-muted); font-size:14px; margin:6px 0 0;}
.wrong-list{ margin-top:18px; text-align:left; display:flex; flex-direction:column; gap:8px; }
.wrong-item{
  display:flex; justify-content:space-between; align-items:center;
  background:rgba(255,255,255,0.5); border:1px solid var(--line);
  border-radius:10px; padding:10px 14px; gap:12px;
}
.wrong-item .hz{ font-family:'Noto Serif SC',serif; font-size:20px; color:var(--text); flex-shrink:0;}
.wrong-item .wi-info{ text-align:right; min-width:0; }
.wrong-item .mn{ font-size:12.5px; color:var(--text-muted); }
.wrong-item .wi-tag{ font-size:10.5px; color:var(--accent-dark); font-weight:600; margin-top:2px; }
.wi-badges{ display:flex; gap:5px; justify-content:flex-end; margin-top:5px; flex-wrap:wrap; }
.wi-badge{
  font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px; white-space:nowrap;
}
.wi-badge.star{ background:var(--accent-soft); color:var(--accent-dark); }
.wi-badge.miss{ background:rgba(197,120,90,0.16); color:#B5644A; }
.wi-unstar{
  flex-shrink:0; background:none; border:none; cursor:pointer;
  font-size:18px; color:var(--accent-dark); padding:4px 2px 4px 8px;
}
.wi-unstar:active{ transform:scale(.9); }

.speed-card{
  background:rgba(255,255,255,0.5); border:1px solid var(--line);
  border-radius:14px; padding:14px 16px; box-shadow:var(--shadow);
}
.speed-avg{ font-size:12.5px; color:var(--text-muted); margin-bottom:10px; }
.speed-avg b{ color:var(--text); }
.speed-bars{
  display:flex; align-items:flex-end; gap:4px; height:60px;
  border-bottom:1px solid var(--line); padding-bottom:2px; margin-bottom:4px;
}
.speed-bar{
  flex:1 1 0; min-width:3px; max-width:16px; border-radius:3px 3px 0 0;
  background:var(--accent-dark);
}

.history-list{ display:flex; flex-direction:column; gap:8px; }
.history-item{
  display:flex; align-items:center; gap:12px;
  background:rgba(255,255,255,0.5); border:1px solid var(--line);
  border-radius:12px; padding:12px 14px; cursor:pointer;
}
.history-item:active{ background:rgba(255,255,255,0.85); }
.history-item .hi-pct{
  font-family:'Noto Serif SC',serif; font-size:20px; font-weight:700;
  color:var(--jade-dark); flex-shrink:0; width:50px; text-align:center;
}
.history-item .hi-info{ min-width:0; flex:1; }
.history-item .hi-top{ font-size:13px; color:var(--text); font-weight:600; }
.history-item .hi-sub{ font-size:11.5px; color:var(--text-muted); margin-top:2px; }
.history-item .hi-date{ font-size:10.5px; color:var(--gold); margin-top:2px; }

.empty-state{ text-align:center; padding:60px 20px; color:var(--text-muted); }
.empty-state .em-hz{ font-family:'Noto Serif SC',serif; font-size:44px; color:var(--gold); margin-bottom:10px;}

.toast{
  position:fixed; left:50%; bottom:calc(24px + var(--safe-b)); transform:translateX(-50%);
  background:var(--accent-dark); color:#fff; border:1px solid rgba(255,255,255,0.25);
  padding:10px 18px; border-radius:999px; font-size:13px; z-index:50;
  opacity:0; transition:opacity .25s ease; pointer-events:none;
  max-width:88vw; text-align:center;
}
.toast.show{ opacity:1; }

@media (min-width:540px){
  .card{ min-height:380px; }
}

/* ---------- jump trigger ---------- */
.jump-trigger{ cursor:pointer; }
.jump-trigger em{ font-style:normal; color:var(--gold); font-size:11px; margin-left:4px; }

/* ---------- bottom sheet ---------- */
.sheet-backdrop{
  position:fixed; inset:0; background:rgba(74,53,72,0.35);
  display:flex; align-items:flex-end; justify-content:center;
  z-index:100; opacity:0; transition:opacity .2s ease;
}
.sheet-backdrop.show{ opacity:1; }
.sheet-backdrop .sheet{
  width:100%; max-width:520px; max-height:76vh;
  background:linear-gradient(180deg, var(--surface), var(--surface-2));
  border-radius:22px 22px 0 0;
  padding:10px 18px calc(20px + var(--safe-b));
  overflow-y:auto;
  box-shadow:0 -10px 34px rgba(201,127,138,0.25);
  transform:translateY(12px);
  transition:transform .2s ease;
}
.sheet-backdrop.show .sheet{ transform:translateY(0); }
.sheet-handle{
  width:36px; height:4px; background:rgba(74,53,72,0.18); border-radius:3px;
  margin:6px auto 12px;
}
.sheet-title{
  font-family:'Noto Serif', serif; font-size:15px; font-weight:600;
  color:var(--text); margin-bottom:10px; padding:0 2px;
}
.jump-list{ display:flex; flex-direction:column; gap:6px; padding-bottom:6px; }
.jump-row{
  display:flex; align-items:center; gap:12px;
  padding:10px 10px; border-radius:10px; cursor:pointer;
}
.jump-row:active{ background:rgba(74,53,72,0.06); }
.jump-row.current{ background:var(--accent-soft); }
.jump-row .jr-num{ font-size:12px; color:var(--text-muted); width:28px; flex-shrink:0; }
.jump-row .jr-hz{ font-size:18px; flex-shrink:0; min-width:44px; color:var(--text);}
.jump-row .jr-mn{ font-size:12.5px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.resume-box{ text-align:center; padding:6px 4px 4px; }
.resume-icon{ font-family:'Noto Serif SC',serif; font-size:30px; color:var(--accent-dark); margin-bottom:6px; }
.resume-msg{ font-size:14.5px; line-height:1.5; color:var(--text); margin-bottom:18px; }
.resume-msg b{ color:var(--gold); }
.resume-actions{ display:flex; gap:10px; }

.onboard-field{ margin-bottom:16px; }

.guide-intro{ font-size:13px; color:var(--text-muted); line-height:1.5; margin:0 2px 16px; }
.guide-block{
  border:1px solid var(--line); border-radius:14px;
  padding:14px 16px; margin-bottom:12px;
  background:rgba(255,255,255,0.4);
}
html.dark-mode .guide-block{ background:rgba(255,255,255,0.05); }
.guide-block.guide-current{ border-color:var(--accent-dark); background:var(--accent-soft); }
.guide-h{ font-family:'Noto Serif',serif; font-weight:700; font-size:14.5px; color:var(--text); margin-bottom:8px; }
.guide-steps{ margin:0; padding-left:20px; }
.guide-steps li{ font-size:13.5px; color:var(--text-muted); line-height:1.6; margin-bottom:4px; }
.guide-steps li b{ color:var(--text); }
.onboard-label{
  display:block; font-size:12.5px; font-weight:600; color:var(--text);
  margin-bottom:8px;
}

.streak-msg{ margin:0 0 6px; font-size:13px; line-height:1.4; color:var(--text-muted); max-width:96%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.streak-msg b{ color:var(--accent-dark); }
.streak-msg.success{ color:var(--jade-dark); }
.streak-msg.success b{ color:var(--jade-dark); }
.streak-bar{
  height:5px; border-radius:3px; background:rgba(74,53,72,0.1); overflow:hidden; margin-bottom:6px; max-width:92%;
}
.streak-bar i{ display:block; height:100%; background:var(--jade); border-radius:3px; }
.streak-meta{
  display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted); font-weight:600; max-width:92%;
}

/* ---------- footer brand credit ---------- */
.brand-footer{
  display:flex; align-items:center; justify-content:center; gap:8px;
  margin-top:8px;
  text-decoration:none;
  padding:6px;
  border-radius:12px;
}
.brand-footer:active{ background:rgba(255,255,255,0.3); }
html.dark-mode .brand-footer:active{ background:rgba(255,255,255,0.06); }
.brand-footer img{
  width:34px; height:34px; border-radius:9px; object-fit:cover;
  box-shadow:0 3px 10px rgba(201,127,138,0.25);
}
.brand-footer span{
  font-size:13px; letter-spacing:.2px; color:var(--text); font-weight:600;
  font-family:'Noto Serif', serif;
}

.sheet-link-btn{
  display:block; width:100%; margin-top:10px; padding:10px;
  background:none; border:none; color:var(--accent-dark);
  font-size:13px; font-weight:600; text-align:center; cursor:pointer;
}

.video-guide-btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; margin-top:12px; padding:12px 14px;
  background:#FF0000; border:none; border-radius:14px;
  color:#fff; font-size:14px; font-weight:700; text-align:center;
  text-decoration:none; cursor:pointer; box-shadow:0 4px 12px rgba(255,0,0,0.25);
}
.video-guide-btn:active{ opacity:0.85; }

.contact-link{
  display:block;
  margin:14px 2px 0;
  padding:13px 16px;
  text-align:center;
  border-radius:14px;
  background:rgba(255,255,255,0.55);
  border:1px solid var(--line);
  color:var(--accent-dark);
  text-decoration:none;
  font-size:13.5px;
  font-weight:700;
}
.contact-link:active{ background:rgba(255,255,255,0.85); }

/* ---------- playlist (bài khóa) button ---------- */
.playlist-btn{
  display:flex; align-items:center; gap:10px;
  margin:14px 2px 0;
  padding:13px 16px;
  border-radius:14px;
  background:linear-gradient(135deg, rgba(201,127,138,0.22), rgba(201,127,138,0.08));
  border:1px solid rgba(201,127,138,0.4);
  color:var(--text);
  text-decoration:none;
  font-size:13.5px;
  font-weight:600;
}
.playlist-btn:active{ background:rgba(201,127,138,0.3); }
.playlist-btn .pb-icon{
  width:30px; height:30px; border-radius:50%; flex-shrink:0;
  background:var(--accent-dark); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:12px;
}
.playlist-btn .pb-txt{ flex:1; }
.playlist-btn .pb-sub{ display:block; font-size:11px; color:var(--text-muted); font-weight:400; margin-top:1px; }

.resume-cta{
  display:flex; align-items:center; gap:12px; width:100%;
  margin:10px 0 0;
  padding:11px 15px;
  border-radius:16px;
  background:linear-gradient(135deg, var(--accent-dark), var(--accent));
  border:none; cursor:pointer;
  box-shadow:0 6px 18px rgba(217,118,157,0.28);
}
.resume-cta:active{ transform:scale(.98); }
.resume-cta.disabled{ opacity:0.6; }
.resume-cta-icon{
  width:34px; height:34px; border-radius:50%; flex-shrink:0;
  background:rgba(255,255,255,0.28); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:13px;
}
.resume-cta-txt{ flex:1; text-align:left; display:flex; flex-direction:column; }
.resume-cta-txt b{ color:#fff; font-size:14.5px; font-family:'Noto Serif',serif; }
.resume-cta-txt span{ color:rgba(255,255,255,0.85); font-size:12px; margin-top:1px; }
.resume-cta-arrow{ color:#fff; font-size:18px; }

<script>
/* ===================== storage ===================== */
/* -----------------------------------------------------------------------
   QUY ƯỚC KEY LƯU TRỮ — ĐỌC TRƯỚC KHI SỬA
   Tiến độ học của người dùng (sao đánh dấu, đang học tới đâu, từ đã nhớ...)
   nằm trong localStorage của trình duyệt, gắn với ĐỊA CHỈ WEB (domain),
   không phải với file index.html. Vì vậy mỗi lần thay file index.html mới
   lên CÙNG một địa chỉ, dữ liệu này KHÔNG bị mất — trừ khi tên các key
   dưới đây bị đổi. Nên: KHÔNG đổi tên các hằng số *_KEY này khi cập nhật
   sau này. Nếu cần đổi cấu trúc dữ liệu, hãy tăng số version trong tên key
   (vd: _v2 -> _v3) và viết thêm bước đọc dữ liệu ở key cũ để chuyển sang,
   thay vì xoá thẳng.
----------------------------------------------------------------------- */
const Store = (() => {
  let mem = {};
  let ok = true;
  try {
    const t = '__t__';
    localStorage.setItem(t, '1');
    localStorage.removeItem(t);
  } catch (e) { ok = false; }

  function get(key, fallback) {
    if (ok) {
      try {
        const v = localStorage.getItem(key);
        return v === null ? fallback : JSON.parse(v);
      } catch (e) { return fallback; }
    }
    return key in mem ? mem[key] : fallback;
  }
  function set(key, val) {
    if (ok) {
      try { localStorage.setItem(key, JSON.stringify(val)); return; } catch (e) {}
    }
    mem[key] = val;
  }
  return { get, set };
})();

const STARS_KEY = 'hsk_stars_v1';
const PROGRESS_KEY = 'hsk_progress_v2';
const SEEN_KEY = 'hsk_seen_v1';
const KNOWN_KEY = 'hsk_known_v1';
const WRONG_KEY = 'hsk_wrong_v1';
const NAME_KEY = 'hsk_name_v1';
const GOAL_KEY = 'hsk_goal_v1';
const DAILY_KEY = 'hsk_daily_v1';
const STREAK_KEY = 'hsk_streak_v1';
const DARK_MODE_KEY = 'hsk_dark_mode_v1';
const HISTORY_KEY = 'hsk_quiz_history_v1';

function isDarkMode() { return Store.get(DARK_MODE_KEY, false) === true; }
function applyDarkMode() {
  document.documentElement.classList.toggle('dark-mode', isDarkMode());
}
function toggleDarkMode() {
  Store.set(DARK_MODE_KEY, !isDarkMode());
  applyDarkMode();
  render();
}

   lệch so với đồng hồ máy, dùng độ lệch đó khi tính "today". Nếu không có
   mạng thì tự động lùi về dùng giờ máy như bình thường — không mất offline. */
let serverTimeOffsetMs = 0;
async function syncServerTime() {
  try {
    const res = await fetch(location.href, { method: 'HEAD', cache: 'no-store' });
    const dateHeader = res.headers.get('date');
    if (dateHeader) {
      const serverTime = new Date(dateHeader).getTime();
      if (!isNaN(serverTime)) serverTimeOffsetMs = serverTime - Date.now();
    }
  } catch (e) {
    // offline, or mở bằng file:// không có header ngày — cứ dùng giờ máy
  }
}
function nowAdjusted() {
  return new Date(Date.now() + serverTimeOffsetMs);
}

function todayStr() {
  const d = nowAdjusted();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function yesterdayStr() {
  const d = nowAdjusted();
  d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function getName() { return Store.get(NAME_KEY, ''); }

function getGoal() { return Store.get(GOAL_KEY, 0); }

/* Từ khác nhau học viên đã chạm tới today (lật thẻ, or trả lời trắc
   nghiệm/gõ chữ dù đúng hay sai) — dùng để tính mục tiêu mỗi ngày & streak. */
function getDailyProgress() {
  const raw = Store.get(DAILY_KEY, null);
  const today = todayStr();
  if (!raw || typeof raw !== 'object' || raw.date !== today || !Array.isArray(raw.ids)) {
    return { date: today, ids: [] };
  }
  return raw;
}
function getStreak() {
  const raw = Store.get(STREAK_KEY, { count: 0, lastDate: null });
  return (raw && typeof raw === 'object') ? raw : { count: 0, lastDate: null };
}
/* Streak hiển thị: nếu khoảng cách quá 1 ngày kể từ lần đạt mục tiêu gần nhất
   thì coi như về 0 — không cảnh báo, không thông báo, chỉ lặng lẽ hiện lại từ đầu. */
function effectiveStreakCount() {
  const s = getStreak();
  const today = todayStr();
  const yest = yesterdayStr();
  if (s.lastDate === today || s.lastDate === yest) return s.count;
  return 0;
}
function markDailyTouch(id) {
  const progress = getDailyProgress();
  const isNewTouch = !progress.ids.includes(id);
  if (isNewTouch) {
    progress.ids.push(id);
    Store.set(DAILY_KEY, progress); // chỉ ghi khi thực sự có từ mới, tránh lưu trùng dữ liệu không đổi
  }

  const goal = getGoal();
  if (!goal || progress.ids.length < goal) return;
  const s = getStreak();
  const today = todayStr();
  if (s.lastDate === today) return; // đã tính today rồi
  const yest = yesterdayStr();
  const newCount = (s.lastDate === yest) ? s.count + 1 : 1;
  Store.set(STREAK_KEY, { count: newCount, lastDate: today });
  const name = getName();
  toast(`🎉 Congrats ${name ? name + ', ' : ''}you've hit a ${newCount}-day streak!`);
}
function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s == null ? '' : String(s);
  return div.innerHTML;
}
function highlightExample(text, target) {
  if (!text) return '';
  if (!target) return escapeHtml(text);
  const idx = text.indexOf(target);
  if (idx === -1) return escapeHtml(text);
  const before = escapeHtml(text.slice(0, idx));
  const match = escapeHtml(text.slice(idx, idx + target.length));
  const after = escapeHtml(text.slice(idx + target.length));
  return `${before}<span class="hl-word">${match}</span>${after}`;
}

/* ===================== data helpers ===================== */
const LEVEL_NAMES = {
  1: 'Beginner', 2: 'Beginner', 3: 'Beginner',
  4: 'Intermediate', 5: 'Advanced', 6: 'Advanced'
};

function levelWords(level) { return window.HSK_DATA[String(level)] || []; }

function lessonsInLevel(level) {
  const set = new Set();
  levelWords(level).forEach(w => set.add(w.bai));
  return Array.from(set).sort((a, b) => a - b);
}

function allDataFlat() {
  let acc = [];
  for (let lv = 1; lv <= 6; lv++) acc = acc.concat(levelWords(lv));
  return acc;
}

/* Số âm tiết = số ký tự Hán trong từ (mỗi chữ Hán = 1 âm tiết). */
function charCount(word) {
  return Array.from(word || '').length;
}

const SHUFFLE_KEY = 'hsk_shuffle_order_v1';
function getShuffleOrder(level) {
  const total = levelWords(level).length;
  const raw = Store.get(SHUFFLE_KEY, {});
  const all = (raw && typeof raw === 'object' && !Array.isArray(raw)) ? raw : {};
  const key = String(level);
  if (Array.isArray(all[key]) && all[key].length === total) {
    return all[key];
  }
  const ids = shuffle(levelWords(level).map(w => w.id));
  all[key] = ids;
  Store.set(SHUFFLE_KEY, all);
  return ids;
}

function wordsFor(level, bai) {
  const all = levelWords(level);
  if (bai === 'all') {
    const order = getShuffleOrder(level);
    const byId = {};
    all.forEach(w => { byId[w.id] = w; });
    return order.map(id => byId[id]).filter(Boolean);
  }
  return all.filter(w => w.bai === bai);
}

function findWordById(id) {
  for (let lv = 1; lv <= 6; lv++) {
    const found = levelWords(lv).find(w => w.id === id);
    if (found) return found;
  }
  return null;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ===================== TTS ===================== */
/* Some hanzi are polyphonic (多音字): the device's built-in voice often
   defaults to the character's most common reading, which is wrong for
   certain words here (e.g. 还 read as "hái" when this word actually means
   "return"/return and should be "huán"). For known cases we speak a short,
   unambiguous two-character word instead of the bare character so the TTS
   engine picks the correct reading. This only changes what gets spoken —
   the displayed hanzi/pinyin/meaning are never touched. Extend this map if
   other polyphonic words are reported as mispronounced. */
const POLYPHONE_TTS_OVERRIDES = {
  '还': { huan: '归还' } // huán "return" — disambiguate away from the "hái" reading
};
function stripTones(s) {
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}
function speechTextFor(w) {
  if (!w) return '';
  if (w.word && w.word.length === 1 && w.word_pinyin && POLYPHONE_TTS_OVERRIDES[w.word]) {
    const base = stripTones(w.word_pinyin);
    const overrides = POLYPHONE_TTS_OVERRIDES[w.word];
    for (const key in overrides) {
      if (base.startsWith(key)) return overrides[key];
    }
  }
  return w.word;
}

let zhVoice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const voices = speechSynthesis.getVoices();
  const zhVoices = voices.filter(v => v.lang === 'zh-CN' || (v.lang && v.lang.toLowerCase().startsWith('zh')));
  if (zhVoices.length === 0) { zhVoice = null; return; }
  // Network/cloud voices (localService === false) are almost always higher quality
  // and pronounce compound words far more naturally than the offline/local voice.
  // Prefer those; fall back to exact zh-CN; then to whatever Chinese voice exists.
  zhVoice = zhVoices.find(v => v.localService === false)
    || zhVoices.find(v => v.lang === 'zh-CN')
    || zhVoices[0];
}
if ('speechSynthesis' in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

/* Path to a pre-generated AI-voice mp3, if one exists for this word/example.
   Files are optional — the app works fine without them (falls back to the
   device's built-in voice). See /audio/README in the repo for how to add them. */
function audioPathFor(w, isExample) {
  if (!w || !w.id) return null;
  const stt = String(w.id).split('-')[1];
  if (!stt) return null;
  const base = (typeof window.HSK_AUDIO_BASE === 'string' && window.HSK_AUDIO_BASE) ? window.HSK_AUDIO_BASE : '';
  return `${base}audio/hsk${w.level}/${stt}${isExample ? '-ex' : ''}.mp3`;
}

let currentAudio = null;
function speak(text, audioPath) {
  if (!text) return;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();

  if (audioPath) {
    const audio = new Audio(audioPath);
    currentAudio = audio;
    let fellBack = false;
    audio.addEventListener('error', () => {
      if (fellBack) return;
      fellBack = true;
      speakBrowser(text);
    });
    audio.play().catch(() => {
      if (fellBack) return;
      fellBack = true;
      speakBrowser(text);
    });
    return;
  }
  speakBrowser(text);
}

function speakBrowser(text) {
  if (!('speechSynthesis' in window)) { toast('This device does not support audio playback'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  if (zhVoice) u.voice = zhVoice;
  u.rate = 0.92;
  speechSynthesis.speak(u);
}

/* ===================== random review mini-game ===================== */
let randomReviewLevels = new Set([1, 2, 3, 4, 5, 6]);
let randomReviewMode = 'mcq';
let randomReviewCount = 20;
const RANDOM_REVIEW_COUNT_OPTIONS = [10, 15, 20, 30, 40, 50];
let levelReviewCount = 'all';
const LEVEL_REVIEW_COUNT_OPTIONS = [15, 20, 25, 30, 35, 40, 45, 50];

function openRandomReviewSheet() {
  renderRandomReviewSheet();
}

function renderRandomReviewSheet() {
  const seen = getSeenSet();
  const perLevel = {};
  for (let lv = 1; lv <= 6; lv++) {
    perLevel[lv] = levelWords(lv).filter(w => seen.has(w.id)).length;
  }
  let pool = [];
  let distractorPool = [];
  for (let lv = 1; lv <= 6; lv++) {
    if (!randomReviewLevels.has(lv)) continue;
    pool = pool.concat(levelWords(lv).filter(w => seen.has(w.id)));
    distractorPool = distractorPool.concat(levelWords(lv));
  }
  const selectedCount = pool.length;
  const sampleSize = Math.min(selectedCount, randomReviewCount);

  showSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">🎲 Random review</div>
    <p class="guide-intro">Review words you've learned (all levels by default) — deselect levels if you like:</p>
    <div class="chip-row" id="rr-level-chips" style="flex-wrap:wrap;overflow:visible;">
      ${[1, 2, 3, 4, 5, 6].map(lv => `<div class="chip ${randomReviewLevels.has(lv) ? 'active' : ''}" data-lv="${lv}">HSK${lv} (${perLevel[lv]})</div>`).join('')}
    </div>
    <label class="onboard-label" style="display:block;margin-top:14px;">Number of words to review</label>
    <div class="chip-row" id="rr-count-chips" style="flex-wrap:wrap;overflow:visible;">
      ${RANDOM_REVIEW_COUNT_OPTIONS.map(n => `<div class="chip ${randomReviewCount === n ? 'active' : ''}" data-count="${n}">${n}</div>`).join('')}
    </div>
    <label class="onboard-label" style="display:block;margin-top:14px;">Review format</label>
    <div class="chip-row" id="rr-mode-chips">
      <div class="chip ${randomReviewMode === 'mcq' ? 'active' : ''}" data-mode="mcq">Multiple choice</div>
      <div class="chip ${randomReviewMode === 'type' ? 'active' : ''}" data-mode="type">Type Chinese characters</div>
    </div>
    <button class="nav-btn primary" id="rr-start-btn" style="width:100%;margin-top:16px;" ${selectedCount === 0 ? 'disabled' : ''}>
      ${selectedCount > 0 ? `Start review (${sampleSize} words)` : 'No words learned yet in the selected levels'}
    </button>
  `);

  document.querySelectorAll('#rr-level-chips .chip').forEach(chip => {
    chip.onclick = () => {
      const lv = Number(chip.dataset.lv);
      if (randomReviewLevels.has(lv)) {
        if (randomReviewLevels.size > 1) randomReviewLevels.delete(lv);
      } else {
        randomReviewLevels.add(lv);
      }
      renderRandomReviewSheet();
    };
  });
  document.querySelectorAll('#rr-count-chips .chip').forEach(chip => {
    chip.onclick = () => {
      randomReviewCount = Number(chip.dataset.count);
      renderRandomReviewSheet();
    };
  });
  document.querySelectorAll('#rr-mode-chips .chip').forEach(chip => {
    chip.onclick = () => {
      randomReviewMode = chip.dataset.mode;
      renderRandomReviewSheet();
    };
  });
  const startBtn = document.getElementById('rr-start-btn');
  if (startBtn && selectedCount > 0) {
    startBtn.onclick = () => {
      const sample = shuffle(pool).slice(0, sampleSize);
      closeSheet();
      startRandomReview(sample, randomReviewMode, distractorPool);
    };
  }
}

function startRandomReview(words, mode, distractorPool) {
  go(mode, {
    mode,
    level: null,
    bai: 'all',
    quizOrigin: 'random',
    quiz: { words, idx: 0, correct: 0, wrong: [], answered: false, times: [], startTime: Date.now(), pool: distractorPool || words }
  });
}

/* Random review toàn bộ từ của MỘT cấp HSK cụ thể (mở từ trang cấp độ).
   Mỗi lần vào sẽ xáo lại thứ tự khác nhau. Người dùng chọn trắc nghiệm hay gõ chữ. */
function renderLevelReviewSheet(lv) {
  const all = levelWords(lv);
  const sampleSize = levelReviewCount === 'all' ? all.length : Math.min(all.length, levelReviewCount);
  showSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">🎲 Review all HSK ${lv} words</div>
    <p class="guide-intro">Randomly review all HSK ${lv} vocabulary (order changes each time).</p>

    </button>

  document.querySelectorAll('#lr-count-chips .chip').forEach(chip => {

      renderLevelReviewSheet(lv);
    };
  });
  document.querySelectorAll('#lr-mode-chips .chip').forEach(chip => {
    chip.onclick = () => {
      randomReviewMode = chip.dataset.mode;
      renderLevelReviewSheet(lv);
    };
  });
  const startBtn = document.getElementById('lr-start-btn');
  if (startBtn && all.length > 0) {
    startBtn.onclick = () => {
      const sample = shuffle(all).slice(0, sampleSize);
      closeSheet();
      startRandomReview(sample, randomReviewMode, all);
    };
  }
}

/* ===================== router / state ===================== */
const app = document.getElementById('app');
const mainEl = document.getElementById('main');
const topbarEl = document.getElementById('topbar');

let state = {
  screen: 'home',
  level: null,
  bai: 'all',
  mode: null, // 'study' | 'mcq' | 'type'
  cardIdx: 0,
  quiz: null,
  quizOrigin: null // 'level' | 'starred' | 'random'
};

function go(screen, patch = {}) {
  state = { ...state, screen, ...patch };
  render();
  window.scrollTo(0, 0);
}

/* ===================== render root ===================== */
function render() {
  try {
    renderTopbar();
    if (state.screen === 'home') return renderHome();
    if (state.screen === 'level') return renderLevel();
    if (state.screen === 'study') return renderStudy();
    if (state.screen === 'mcq') return renderMCQ();
    if (state.screen === 'type') return renderType();
    if (state.screen === 'result') return renderResult();
    if (state.screen === 'starred') return renderStarred();
    if (state.screen === 'history') return renderHistory();
  } catch (err) {
    console.error('HSK Rush render error:', err);
    renderFatalError();
  }
}

function renderFatalError() {
  topbarEl.innerHTML = `<div class="brand"><b>HSK Rush</b><span>Something went wrong</span></div>`;
  mainEl.innerHTML = `
    <div class="empty-state">
      <div class="em-hz">误</div>
      <div>Something went wrong while displaying the page.<br/>Tap the button below to reload — your saved progress won't be lost.</div>
      <div class="nav-row" style="margin-top:18px;">
        <button class="nav-btn primary" id="fatal-reload">Reload page</button>
      </div>
    </div>
  `;
  const btn = document.getElementById('fatal-reload');
  if (btn) btn.onclick = () => location.reload();
}

function renderTopbar() {
  const showBack = state.screen !== 'home';
  topbarEl.innerHTML = `
    ${showBack ? `<button class="back-btn" id="btn-back">‹</button>` : `<button class="seal-mark" id="btn-home">速</button>`}
    <div class="brand">
      <b>${titleFor()}</b>
      <span>${subtitleFor()}</span>
    </div>
    <div class="spacer"></div>
    ${state.screen === 'home' ? `
      <button class="icon-btn" id="btn-star" title="Difficult words">★</button>
      <button class="icon-btn" id="btn-history" title="Review history">⏱</button>
      <button class="icon-btn" id="btn-dark" title="Dark mode">${isDarkMode() ? '☀️' : '🌙'}</button>
      <button class="icon-btn icon-btn-accent" id="btn-settings" title="Rename / daily goal">⚙️</button>
    ` : ''}
  `;
  const back = document.getElementById('btn-back');
  if (back) back.onclick = onBack;
  const home = document.getElementById('btn-home');
  if (home) home.onclick = () => go('home');
  const darkBtn = document.getElementById('btn-dark');
  if (darkBtn) darkBtn.onclick = toggleDarkMode;
  const settingsBtn = document.getElementById('btn-settings');
  if (settingsBtn) settingsBtn.onclick = () => showGoalNameSheet(false);
  const star = document.getElementById('btn-star');
  if (star) star.onclick = () => go('starred');
  const historyBtn = document.getElementById('btn-history');
  if (historyBtn) historyBtn.onclick = () => go('history');
}

function titleFor() {
  if (state.screen === 'home') return 'HSK Rush';
  if (state.screen === 'level') return `HSK ${state.level}`;
  if (state.screen === 'starred') return 'Difficult words';
  if (state.screen === 'history') return 'Review history';
  if (state.level) return `HSK ${state.level}`;
  if (['study', 'mcq', 'type', 'result'].includes(state.screen)) {
    return state.quizOrigin === 'random' ? '🎲 Random review' : 'Difficult words';
  }
  return 'HSK Rush';
}
function subtitleFor() {
  if (state.screen === 'home') return 'Study & review vocabulary';
  if (state.screen === 'study') return 'Study vocabulary';
  if (state.screen === 'mcq') return 'Multiple choice';
  if (state.screen === 'type') return 'Type Chinese characters';
  if (state.screen === 'result') return 'Result';
  if (state.screen === 'starred') return 'Review difficult words';
  if (state.screen === 'history') return 'Compare answer speed';
  return 'Choose lesson';
}

function backTargetScreen() {
  if (state.level) return 'level';
  if (state.quizOrigin === 'random') return 'home';
  return 'starred';
}

function onBack() {
  if (state.screen === 'level') return go('home');
  if (['study', 'mcq', 'type', 'result'].includes(state.screen)) {
    if (state.level) return go('level', { level: state.level });
    if (state.quizOrigin === 'random') return go('home');
    return go('starred');
  }
  if (state.screen === 'starred') return go('home');
  if (state.screen === 'history') return go('home');
  go('home');
}

/* Tìm phiên học/ôn đang dang dở gần nhất (theo thời điểm cập nhật), dùng cho
   nút "Continue learning" ở trang chủ — để không phải tự chọn lại cấp/bài/chế độ. */
function getMostRecentProgress() {
  const all = getAllProgress();
  let bestKey = null, best = null;
  for (const key in all) {
    const p = all[key];
    if (!p || typeof p !== 'object' || typeof p.idx !== 'number') continue;
    if (!best || (p.updatedAt || 0) > (best.updatedAt || 0)) { best = p; bestKey = key; }
  }
  if (!bestKey) return null;
  const parts = bestKey.split('-');
  if (parts.length !== 3) return null;
  const [levelStr, baiStr, mode] = parts;
  const level = Number(levelStr);
  const bai = baiStr === 'all' ? 'all' : Number(baiStr);
  if (!level || !mode) return null;
  return { level, bai, mode, progress: best };
}

function resumeMostRecent() {
  const r = getMostRecentProgress();
  if (!r) return;
  const words = wordsFor(r.level, r.bai);
  if (words.length === 0) { toast('Could not find the right lesson to continue'); return; }
  if (r.mode === 'study') {
    flipped = false;
    go('study', { mode: 'study', level: r.level, bai: r.bai, cardIdx: r.progress.idx });
  } else {
    const wrongWords = (r.progress.wrongIds || []).map(findWordById).filter(Boolean);
    go(r.mode, {
      mode: r.mode, level: r.level, bai: r.bai,
      quiz: { words, idx: r.progress.idx, correct: r.progress.correct || 0, wrong: wrongWords, answered: false }
    });
  }
}

function startMode(mode) {
  const words = wordsFor(state.level, state.bai);
  if (words.length === 0) { toast('No words in this lesson'); return; }
  const key = progressKey(state.level, state.bai, mode);
  const prog = getProgress(key);
  const hasResumable = prog && prog.idx > 0 && prog.idx < words.length;

  if (mode === 'study') {
    if (hasResumable) {
      openResumeSheet(
        `You're currently on word <b>${prog.idx + 1}/${words.length}</b> here. Continue or start over?`,
        () => { flipped = false; go('study', { mode, quizOrigin: 'level', cardIdx: prog.idx }); },
        () => { clearProgress(key); flipped = false; go('study', { mode, quizOrigin: 'level', cardIdx: 0 }); }
      );
    } else {
      flipped = false;
      go('study', { mode, quizOrigin: 'level', cardIdx: 0 });
    }
    return;
  }

  function freshQuiz() {
    go(mode, { mode, quizOrigin: 'level', quiz: { words, idx: 0, correct: 0, wrong: [], answered: false, times: [], startTime: Date.now() } });
  }
  function resumedQuiz() {
    const wrongWords = (prog.wrongIds || []).map(findWordById).filter(Boolean);
    go(mode, { mode, quizOrigin: 'level', quiz: { words, idx: prog.idx, correct: prog.correct || 0, wrong: wrongWords, answered: false, times: [], startTime: Date.now() } });
  }
  if (hasResumable) {
    openResumeSheet(
      `You're partway through, on question <b>${prog.idx + 1}/${words.length}</b> (${prog.correct || 0} correct). Continue or start over?`,
      resumedQuiz,
      () => { clearProgress(key); freshQuiz(); }
    );
  } else {
    freshQuiz();
  }
}

/* ===================== STUDY (flashcards) ===================== */
let flipped = false;
function renderStudy() {
  const words = state.level ? wordsFor(state.level, state.bai) : (state.studyWords || []);
  const idx = Math.max(0, Math.min(state.cardIdx, words.length - 1));
  const w = words[idx];
  if (!w) { toast('No words to learn'); go(backTargetScreen(), { level: state.level }); return; }
  const stars = getStars();
  const isStar = stars.has(w.id);
  const pct = Math.round(((idx + 1) / words.length) * 100);
  markSeen(w.id);
  markDailyTouch(w.id);

  mainEl.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--text-muted);margin-bottom:2px;">
      <span class="jump-trigger" id="jump-trigger">${idx + 1} / ${words.length} <em>select ▾</em></span>
      <span>Lesson ${w.bai}</span>
    </div>
    <div class="progress-track"><i style="width:${pct}%"></i></div>
    <div class="flip-wrap">
      <div class="card" id="flash-card">
        <div class="bai-tag">Lesson ${w.bai} · ${w.pos || ''}</div>
        <button class="star-btn ${isStar ? 'active' : ''}" id="star-btn">${isStar ? '★' : '☆'}</button>
        ${!flipped ? `
          <div class="word hanzi">${w.word}</div>
          <div class="hint">Tap to see meaning</div>
        ` : `
          <div class="back-content">
            <div class="word hanzi" style="font-size:38px;">${w.word}</div>
            <div class="meaning">${w.meaning}</div>
            <div class="amhv">Pinyin: ${w.word_pinyin || '—'}</div>
            ${w.example ? `
            <div class="example-block">
              <div class="example-hz hanzi">${highlightExample(w.example, w.word)}</div>
              <div class="example-py">${highlightExample(w.pinyin, w.word_pinyin)}</div>
              <div class="example-vi">${w.meaning_ex}</div>
            </div>` : ''}
          </div>
        `}
      </div>
    </div>
    <button class="tts-btn" id="tts-btn">🔊 ${flipped && w.example ? 'Listen to example sentence' : 'Listen to pronunciation'}</button>
    <div class="nav-row">
      <button class="nav-btn" id="prev-btn" ${idx === 0 ? 'disabled' : ''}>‹ Back</button>
      <button class="nav-btn primary" id="next-btn">${idx === words.length - 1 ? 'Complete' : 'Next ›'}</button>
    </div>
  `;

  const studyKey = state.level ? progressKey(state.level, state.bai, 'study') : null;

  document.getElementById('flash-card').onclick = (e) => {
    if (e.target.closest('.star-btn')) return;
    flipped = !flipped;
    renderStudy();
  };
  document.getElementById('star-btn').onclick = () => {
    toggleStar(w.id);
    renderStudy();
  };
  document.getElementById('tts-btn').onclick = (e) => {
    e.stopPropagation();
    speak(flipped && w.example ? w.example : speechTextFor(w), audioPathFor(w, flipped && !!w.example));
  };
  document.getElementById('jump-trigger').onclick = () => {
    openJumpSheet(words, idx, (i) => {
      flipped = false;
      if (studyKey) saveProgress(studyKey, { idx: i, total: words.length });
      go('study', { cardIdx: i });
    });
  };
  document.getElementById('prev-btn').onclick = () => {
    flipped = false;
    const newIdx = Math.max(0, idx - 1);
    if (studyKey) saveProgress(studyKey, { idx: newIdx, total: words.length });
    go('study', { cardIdx: newIdx });
  };
  document.getElementById('next-btn').onclick = () => {
    flipped = false;
    if (idx === words.length - 1) {
      if (studyKey) clearProgress(studyKey);
      toast('All done! Starting over from the beginning.');
      go(backTargetScreen(), { level: state.level });
      return;
    }
    const newIdx = idx + 1;
    if (studyKey) saveProgress(studyKey, { idx: newIdx, total: words.length });
    go('study', { cardIdx: newIdx });
  };
}

/* ===================== MCQ ===================== */
function renderMCQ() {
  const q = state.quiz;
  if (q.idx >= q.words.length) return go('result');
  const w = q.words[q.idx];
  if (!q.options || q._optFor !== q.idx) {
    const wLen = charCount(w.word);
    let basePool = q.pool || (state.level ? wordsFor(state.level, state.bai) : q.words);
    let distractorsPool = basePool.filter(x => x.id !== w.id && x.word !== w.word && charCount(x.word) === wLen);
    if (distractorsPool.length < 3) {
      distractorsPool = basePool.filter(x => x.id !== w.id && x.word !== w.word);
    }
    if (distractorsPool.length < 3) {
      basePool = state.level ? levelWords(state.level) : allDataFlat();
      distractorsPool = basePool.filter(x => x.id !== w.id && x.word !== w.word && charCount(x.word) === wLen);
      if (distractorsPool.length < 3) {
        distractorsPool = basePool.filter(x => x.id !== w.id && x.word !== w.word);
      }
    }
    const seenWords = new Set([w.word]);
    const distractors = [];
    for (const cand of shuffle(distractorsPool)) {
      if (seenWords.has(cand.word)) continue;
      seenWords.add(cand.word);
      distractors.push(cand);
      if (distractors.length === 3) break;
    }
    q.options = shuffle([w, ...distractors]);
    q._optFor = q.idx;
    q.answered = false;
    q._qStart = Date.now();
  }

  mainEl.innerHTML = `
    <div class="quiz-top">
      <span class="jump-trigger" id="jump-trigger">Question ${q.idx + 1} / ${q.words.length} <em>select ▾</em></span>
      <span class="score-pill">Correct: ${q.correct}</span>
    </div>
    <div class="q-card">
      <div class="q-meaning">${w.meaning}</div>
      <div class="q-pos">${w.pos || ''} ${w.bai ? '· HSK ' + w.level + ' · Lesson ' + w.bai : ''}</div>
      <div class="q-feedback" id="q-feedback"></div>
      <div class="stamp-overlay" id="stamp"><div class="stamp-ring">${q.lastCorrect ? '对' : '×'}</div></div>
    </div>
    <div class="mcq-grid" id="mcq-grid">
      ${q.options.map(o => `<button class="mcq-opt hanzi" data-id="${o.id}">${o.word}</button>`).join('')}
    </div>
    <div id="mcq-continue-wrap"></div>
  `;

  mainEl.querySelectorAll('.mcq-opt').forEach(btn => {
    btn.onclick = () => answerMCQ(btn, w, q);
  });
  document.getElementById('jump-trigger').onclick = () => {
    openJumpSheet(q.words, q.idx, (i) => {
      q.idx = i;
      q.answered = false;
      if (state.level) {
        saveProgress(progressKey(state.level, state.bai, 'mcq'), { idx: q.idx, correct: q.correct, wrongIds: q.wrong.map(x => x.id), total: q.words.length });
      }
      render();
    });
  };
}

function answerMCQ(btn, w, q) {
  if (q.answered) return;
  q.answered = true;
  const elapsed = Date.now() - (q._qStart || Date.now());
  (q.times = q.times || []).push(elapsed);
  const chosenId = btn.dataset.id;
  const isCorrect = chosenId === w.id;
  q.lastCorrect = isCorrect;
  mainEl.querySelectorAll('.mcq-opt').forEach(b => {
    b.disabled = true;
    if (b.dataset.id === w.id) b.classList.add('correct');
    else if (b === btn) b.classList.add('incorrect');
    const optWord = q.options.find(o => o.id === b.dataset.id);
    if (optWord && optWord.word_pinyin) {
      const py = document.createElement('div');
      py.className = 'mcq-opt-py';
      py.textContent = optWord.word_pinyin;
      b.appendChild(py);
    }
    if (optWord && optWord.id !== w.id && optWord.meaning) {
      const mn = document.createElement('div');
      mn.className = 'mcq-opt-meaning';
      mn.textContent = optWord.meaning;
      b.appendChild(mn);
    }
  });
  speak(speechTextFor(w), audioPathFor(w, false));
  markDailyTouch(w.id);
  const feedbackEl = document.getElementById('q-feedback');
  if (feedbackEl) {
    feedbackEl.textContent = isCorrect ? praiseMsg() : encourageMsg();
    feedbackEl.className = 'q-feedback show ' + (isCorrect ? 'ok' : 'bad');
  }
  const stampEl = document.getElementById('stamp');
  stampEl.innerHTML = `<div class="stamp-ring">${isCorrect ? '对' : '×'}</div>`;
  stampEl.classList.add('show');
  if (!isCorrect) stampEl.classList.add('wrong');

  function goNext() {
    q.idx++;
    if (state.level) {
      const key = progressKey(state.level, state.bai, 'mcq');
      if (q.idx >= q.words.length) clearProgress(key);
      else saveProgress(key, { idx: q.idx, correct: q.correct, wrongIds: q.wrong.map(x => x.id), total: q.words.length });
    }
    render();
  }

  if (isCorrect) {
    q.correct++;
    removeFromDifficultBook(w.id);
  } else {
    q.wrong.push(w);
    incrementWrong(w.id);
  }
  const wrap = document.getElementById('mcq-continue-wrap');
  if (wrap) {
    wrap.innerHTML = `<button class="nav-btn primary" id="mcq-next-btn" style="width:100%;margin-top:14px;">Next word ›</button>`;
    document.getElementById('mcq-next-btn').onclick = goNext;
  }
}

/* ===================== TYPE mode ===================== */
function renderType() {
  const q = state.quiz;
  if (q.idx >= q.words.length) return go('result');
  const w = q.words[q.idx];
  const answered = !!q.answered;
  if (q._timerIdx !== q.idx) { q._qStart = Date.now(); q._timerIdx = q.idx; }

  mainEl.innerHTML = `
    <div class="quiz-top">
      <span class="jump-trigger" id="jump-trigger">Question ${q.idx + 1} / ${q.words.length} <em>select ▾</em></span>
      <span class="score-pill">Correct: ${q.correct}</span>
    </div>
    <div class="q-card">
      <div class="q-meaning">${w.meaning}</div>
      <div class="q-pos">${w.pos || ''} ${w.bai ? '· HSK ' + w.level + ' · Lesson ' + w.bai : ''}</div>
      <div class="stamp-overlay ${answered ? 'show' + (q.lastCorrect ? '' : ' wrong') : ''}" id="stamp"><div class="stamp-ring">${answered && q.lastCorrect === false ? '×' : '对'}</div></div>
    </div>
    <div class="type-wrap">
      <input class="type-input hanzi" id="type-input" placeholder="Type the Chinese character…" autocomplete="off" autocorrect="off" autocapitalize="off" ${answered ? 'disabled' : ''} value="${answered ? (q.lastInput || '').replace(/"/g, '&quot;') : ''}" />
      <div class="type-feedback ${answered ? (q.lastCorrect ? 'ok' : 'bad') : ''}" id="type-feedback">${answered ? (q.lastCorrect ? `${escapeHtml(praiseMsg())} 对` : `${escapeHtml(encourageMsg())} Answer: ${w.word}${w.word_pinyin ? ` <em>(${w.word_pinyin})</em>` : ''}`) : ''}</div>
      <div class="type-actions">
        ${!answered ? `
          <button class="nav-btn primary" id="check-btn" style="width:100%;">Check</button>
        ` : `
          <button class="nav-btn primary" id="next-btn" style="flex:1;">Next question ›</button>
        `}
      </div>
    </div>
  `;

  const input = document.getElementById('type-input');
  if (!answered) input.focus();

  document.getElementById('jump-trigger').onclick = () => {
    openJumpSheet(q.words, q.idx, (i) => {
      q.idx = i;
      q.answered = false;
      if (state.level) {
        saveProgress(progressKey(state.level, state.bai, 'type'), { idx: q.idx, correct: q.correct, wrongIds: q.wrong.map(x => x.id), total: q.words.length });
      }
      render();
    });
  };

  function saveTypeProgress() {
    if (!state.level) return;
    const key = progressKey(state.level, state.bai, 'type');
    if (q.idx >= q.words.length) clearProgress(key);
    else saveProgress(key, { idx: q.idx, correct: q.correct, wrongIds: q.wrong.map(x => x.id), total: q.words.length });
  }

  if (!answered) {
    function submit() {
      const val = input.value.trim();
      if (!val) { input.focus(); return; }
      const correct = val === w.word;
      q.answered = true;
      q.lastCorrect = correct;
      q.lastInput = val;
      const elapsed = Date.now() - (q._qStart || Date.now());
      (q.times = q.times || []).push(elapsed);
      if (correct) { q.correct++; removeFromDifficultBook(w.id); } else { q.wrong.push(w); incrementWrong(w.id); }
      speak(speechTextFor(w), audioPathFor(w, false));
      markDailyTouch(w.id);
      renderType();
    }
    document.getElementById('check-btn').onclick = submit;
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submit();
    });
  } else {
    // Advancing must happen synchronously inside this tap handler (no setTimeout)
    // so the browser treats focusing the next word's input as a direct result of
    // a real user gesture — that's what makes the on-screen keyboard reopen
    // automatically instead of requiring an extra tap on the input box.
    document.getElementById('next-btn').onclick = () => {
      q.idx++;
      q.answered = false;
      saveTypeProgress();
      render();
    };
  }
}

/* ===================== RESULT ===================== */
function renderResult() {
  const q = state.quiz;
  const total = q.words.length;
  const pct = total ? Math.round((q.correct / total) * 100) : 0;
  const timeArr = q.times || [];
  const totalMs = timeArr.reduce((a, b) => a + b, 0);
  const avgMs = timeArr.length ? totalMs / timeArr.length : 0;
  const maxMs = timeArr.length ? Math.max(...timeArr) : 0;

  if (!q._historySaved && timeArr.length > 0) {
    q._historySaved = true;
    saveHistoryEntry({
      id: 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      ts: Date.now(),
      mode: state.mode,
      level: state.level,
      bai: state.bai,
      origin: state.quizOrigin || (state.level ? 'level' : 'starred'),
      correct: q.correct,
      total,
      totalMs,
      items: q.words.slice(0, timeArr.length).map((w, i) => ({ word: w.word, meaning: w.meaning, ms: timeArr[i] || 0 }))
    });
  }

  mainEl.innerHTML = `
    <div class="result-card">
      <div class="big-num">${pct}%</div>
      <p>${q.correct} / ${total} correct</p>
    </div>
    ${timeArr.length ? `
    <div class="section-label">⏱ Answer speed</div>
    <div class="speed-card">
      <div class="speed-avg">Average <b>${(avgMs / 1000).toFixed(1)}s</b> / question · Total <b>${fmtDuration(totalMs)}</b></div>
      <div class="speed-bars">
        ${timeArr.map(ms => {
          const h = maxMs > 0 ? Math.max(6, Math.round((ms / maxMs) * 56)) : 6;
          return `<div class="speed-bar" style="height:${h}px" title="${(ms / 1000).toFixed(1)}s"></div>`;
        }).join('')}
      </div>
      <button class="sheet-link-btn" id="goto-history-btn" style="margin-top:2px;">📊 View history to compare</button>
    </div>
    ` : ''}
    ${q.wrong.length ? `
      <div class="section-label">Need to review (${q.wrong.length})</div>
      <div class="wrong-list">
        ${q.wrong.map(w => `
          <div class="wrong-item">
            <div class="hz">${w.word}</div>
            <div class="wi-info">
              <div class="mn">${w.meaning}</div>
              <div class="wi-tag">HSK${w.level} · Lesson ${w.bai}</div>
            </div>
          </div>`).join('')}
      </div>
    ` : ''}
    <div class="nav-row">
      <button class="nav-btn" id="back-lv">Back to list</button>
      <button class="nav-btn primary" id="retry-btn">${q.wrong.length ? 'Review missed words' : 'Try again'}</button>
    </div>
  `;
  document.getElementById('back-lv').onclick = () => go(backTargetScreen(), { level: state.level });
  const historyBtn = document.getElementById('goto-history-btn');
  if (historyBtn) historyBtn.onclick = () => go('history');
  document.getElementById('retry-btn').onclick = () => {
    if (state.level) clearProgress(progressKey(state.level, state.bai, state.mode));
    const words = q.wrong.length ? shuffle(q.wrong) : q.words;
    go(state.mode, {
      quiz: { words, idx: 0, correct: 0, wrong: [], answered: false, times: [], startTime: Date.now() }
    });
  };
}

/* ===================== HISTORY ("Review history") ===================== */
function renderHistory() {
  const history = getHistory();
  if (history.length === 0) {
    mainEl.innerHTML = `
      <div class="empty-state">
        <div class="em-hz">空</div>
        <div>No review rounds recorded yet.<br/>Complete a quiz or typing round to see your history & speed here.</div>
      </div>
    `;
    return;
  }
  const modeLabel = { mcq: 'Multiple choice', type: 'Typing', study: 'Study vocabulary' };
  const originLabel = { random: '🎲 Random Review', starred: 'Difficult words' };

  mainEl.innerHTML = `
    <div class="section-label">${history.length} recent rounds</div>
    <div class="history-list" id="history-list">
      ${history.map(h => {
        const pct = h.total ? Math.round((h.correct / h.total) * 100) : 0;
        const avgMs = h.items && h.items.length ? h.totalMs / h.items.length : 0;
        const date = new Date(h.ts);
        const dateStr = date.toLocaleDateString('vi-VN') + ' · ' + date.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
        const tag = originLabel[h.origin] || (h.level ? `HSK${h.level}${h.bai && h.bai !== 'all' ? ' · Lesson ' + h.bai : ''}` : 'Difficult words');
        return `
        <div class="history-item" data-id="${h.id}">
          <div class="hi-pct">${pct}%</div>
          <div class="hi-info">
            <div class="hi-top">${modeLabel[h.mode] || h.mode} · ${tag}</div>
            <div class="hi-sub">${h.correct}/${h.total} correct · ⏱ ${fmtDuration(h.totalMs)} · avg ${(avgMs / 1000).toFixed(1)}s/q</div>
            <div class="hi-date">${dateStr}</div>
          </div>
        </div>`;
      }).join('')}
    </div>
    <button class="nav-btn" id="clear-history-btn" style="width:100%;margin-top:14px;">Clear history</button>
  `;
  document.querySelectorAll('.history-item').forEach(item => {
    item.onclick = () => {
      const h = history.find(x => x.id === item.dataset.id);
      if (h) openHistoryDetailSheet(h);
    };
  });
  const clearBtn = document.getElementById('clear-history-btn');
  if (clearBtn) {
    clearBtn.onclick = () => {
      clearHistory();
      renderHistory();
      toast('Review history cleared');
    };
  }
}

function openHistoryDetailSheet(h) {
  const items = h.items || [];
  const maxMs = items.length ? Math.max(...items.map(i => i.ms)) : 0;
  const avgMs = items.length ? h.totalMs / items.length : 0;
  showSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">${h.correct}/${h.total} correct · ⏱ ${fmtDuration(h.totalMs)}</div>
    <div class="speed-card" style="margin-bottom:12px;">
      <div class="speed-avg">Average <b>${(avgMs / 1000).toFixed(1)}s</b> / question</div>
      <div class="speed-bars">
        ${items.map(i => {
          const hgt = maxMs > 0 ? Math.max(6, Math.round((i.ms / maxMs) * 56)) : 6;
          return `<div class="speed-bar" style="height:${hgt}px" title="${escapeHtml(i.word)}: ${(i.ms / 1000).toFixed(1)}s"></div>`;
        }).join('')}
      </div>
    </div>
    <div class="jump-list">
      ${items.map((i, idx) => `
        <div class="jump-row">
          <span class="jr-num">${idx + 1}</span>
          <span class="jr-hz hanzi">${i.word}</span>
          <span class="jr-mn">${i.meaning || ''}</span>
          <span class="wi-tag" style="margin-left:auto;flex-shrink:0;">${(i.ms / 1000).toFixed(1)}s</span>
        </div>`).join('')}
    </div>
  `);
}

/* ===================== STARRED ("Difficult words") ===================== */
let starredFilterLevel = 'all';
let starredSampleMode = 'all'; // 'all' | 'sample' (10-20 random words)

function starredSubset() {
  const stars = getStars();
  const wrongCounts = getWrongCounts();
  const all = [];
  for (let lv = 1; lv <= 6; lv++) {
    levelWords(lv).forEach(w => {
      if (stars.has(w.id) || wrongCounts[w.id]) all.push(w);
    });
  }
  const filtered = starredFilterLevel === 'all' ? all : all.filter(w => w.level === starredFilterLevel);
  return { all, filtered };
}

function removeFromDifficultBook(id) {
  const stars = getStars();
  if (stars.has(id)) { stars.delete(id); saveStars(stars); }
  clearWrong(id);
}

function starredPool(filtered) {
  if (starredSampleMode !== 'sample') return filtered;
  const n = Math.min(filtered.length, Math.floor(Math.random() * 11) + 10); // 10-20
  return shuffle(filtered).slice(0, n);
}

function renderStarred() {
  const { all, filtered } = starredSubset();

  if (all.length === 0) {
    mainEl.innerHTML = `
      <div class="empty-state">
        <div class="em-hz">★</div>
        <div>Your difficult-words notebook is empty.<br/>Tap ☆ on a flashcard to save it, or any word you get wrong during review will automatically show up here.</div>
      </div>`;
    return;
  }

  const presentLevels = Array.from(new Set(all.map(w => w.level))).sort((a, b) => a - b);
  let chips = `<div class="chip ${starredFilterLevel === 'all' ? 'active' : ''}" data-lv="all">All</div>`;
  presentLevels.forEach(lv => {
    chips += `<div class="chip ${starredFilterLevel === lv ? 'active' : ''}" data-lv="${lv}">HSK ${lv}</div>`;
  });

  const sampleLabel = starredSampleMode === 'sample' ? `${Math.min(filtered.length, 20)}` : '';

  mainEl.innerHTML = `
    <div class="section-label">${all.length} words saved</div>
    <div class="chip-row" id="starred-chip-row">${chips}</div>
    <div class="chip-row" id="starred-sample-row">
      <div class="chip ${starredSampleMode === 'all' ? 'active' : ''}" data-mode="all">Review all (${filtered.length})</div>
      <div class="chip ${starredSampleMode === 'sample' ? 'active' : ''}" data-mode="sample">10-20 random words</div>
    </div>
    <div class="mode-list">
      <div class="mode-card" id="starred-study" ${filtered.length === 0 ? 'style="opacity:.5;pointer-events:none;"' : ''}>
        <div class="m-icon">卡</div>
        <div class="m-txt"><b>Flashcards</b><span>Flip the card, listen to pronunciation</span></div>
        <div class="m-arrow">›</div>
      </div>
      <div class="mode-card" id="starred-mcq" ${filtered.length === 0 ? 'style="opacity:.5;pointer-events:none;"' : ''}>
        <div class="m-icon">选</div>
        <div class="m-txt"><b>Multiple choice</b><span>Choose the correct Chinese character by meaning</span></div>
        <div class="m-arrow">›</div>
      </div>
      <div class="mode-card" id="starred-type" ${filtered.length === 0 ? 'style="opacity:.5;pointer-events:none;"' : ''}>
        <div class="m-icon">写</div>
        <div class="m-txt"><b>Typing</b><span>Type the Chinese character from the meaning & pinyin</span></div>
        <div class="m-arrow">›</div>
      </div>
    </div>
    <div class="wrong-list" style="margin-top:16px;">
      ${filtered.map(w => {
        const isStar = getStars().has(w.id);
        const wc = getWrongCount(w.id);
        const badges = `
          ${isStar ? `<span class="wi-badge star">★ Starred words</span>` : ''}
          ${wc > 0 ? `<span class="wi-badge miss">✕ Missed ${wc}x</span>` : ''}
        `;
        return `
        <div class="wrong-item" data-id="${w.id}" style="cursor:pointer;">
          <div class="hz">${w.word}</div>
          <div class="wi-info">
            <div class="mn">${w.meaning}</div>
            <div class="wi-tag">HSK${w.level} · Lesson ${w.bai}</div>
            <div class="wi-badges">${badges}</div>
          </div>
          <button class="wi-unstar" data-id="${w.id}" title="Remove from difficult words">✕</button>
        </div>`;
      }).join('')}
    </div>
  `;

  document.getElementById('starred-chip-row').querySelectorAll('.chip').forEach(chip => {
    chip.onclick = () => {
      starredFilterLevel = chip.dataset.lv === 'all' ? 'all' : Number(chip.dataset.lv);
      renderStarred();
    };
  });
  document.getElementById('starred-sample-row').querySelectorAll('.chip').forEach(chip => {
    chip.onclick = () => {
      starredSampleMode = chip.dataset.mode;
      renderStarred();
    };
  });

  document.getElementById('starred-study').onclick = () => {
    const pool = starredPool(filtered);
    if (pool.length === 0) { toast('No words to learn'); return; }
    flipped = false;
    go('study', { mode: 'study', level: null, bai: 'all', quizOrigin: 'starred', studyWords: shuffle(pool), cardIdx: 0 });
  };
  document.getElementById('starred-mcq').onclick = () => {
    const pool = starredPool(filtered);
    if (pool.length === 0) { toast('No words to review'); return; }
    go('mcq', {
      mode: 'mcq', level: null, bai: 'all', quizOrigin: 'starred',
      quiz: { words: shuffle(pool), idx: 0, correct: 0, wrong: [], answered: false, times: [], startTime: Date.now() }
    });
  };
  document.getElementById('starred-type').onclick = () => {
    const pool = starredPool(filtered);
    if (pool.length === 0) { toast('No words to review'); return; }
    go('type', {
      mode: 'type', level: null, bai: 'all', quizOrigin: 'starred',
      quiz: { words: shuffle(pool), idx: 0, correct: 0, wrong: [], answered: false, times: [], startTime: Date.now() }
    });
  };

  mainEl.querySelectorAll('.wrong-item').forEach(item => {
    item.onclick = (e) => {
      if (e.target.closest('.wi-unstar')) return;
      const w = findWordById(item.dataset.id);
      if (w) speak(speechTextFor(w), audioPathFor(w, false));
    };
  });
  mainEl.querySelectorAll('.wi-unstar').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      removeFromDifficultBook(btn.dataset.id);
      renderStarred();
    };
  });
}

/* ===================== init ===================== */
document.addEventListener('keydown', (e) => {
  if (state.screen !== 'type') return;
  if (document.getElementById('sheet-backdrop')) return;
  const q = state.quiz;
  if (!q || !q.answered) return;
  if (e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    const btn = document.getElementById('next-btn');
    if (btn) btn.click();
  }
});
applyDarkMode();
render();
if (!getName() || !getGoal()) {
  showGoalNameSheet(true);
}
syncServerTime().then(() => {
  if (state.screen === 'home') render();
});

</script>
